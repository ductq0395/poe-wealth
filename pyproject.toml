[project]
name = "poe-wealth"
version = "0.1.0"
description = "Local-only Path of Exile wealth tracker (Wealthy Exile style)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyooz"]

[project.scripts]
poe-wealth = "poewealth.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["poewealth*"]

[tool.setuptools.package-data]
poewealth = ["static/*"]
